<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#090d16">
    <title>VibeStream Ultimate Pro</title>
    <style>
        :root {
            --bg: #090d16;
            --card: rgba(30, 41, 59, 0.75);
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.35);
            --text: #f8fafc;
            --subtext: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-bottom: 165px; overflow-x: hidden; user-select: none; }

        .ambient-bg { position: fixed; top: -10%; left: -10%; width: 120%; height: 55%; background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%); pointer-events: none; z-index: 0; }

        header { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(16px); background: rgba(9, 13, 22, 0.9); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .logo { font-size: 1.25rem; font-weight: 800; background: linear-gradient(90deg, #10b981, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .badge { font-size: 0.72rem; background: rgba(16,185,129,0.15); color: #10b981; padding: 5px 10px; border-radius: 20px; border: 1px solid rgba(16,185,129,0.3); cursor: pointer; }

        .container { position: relative; z-index: 5; padding: 15px; }
        .search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
        .search-bar input { flex: 1; padding: 12px 15px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: rgba(15, 23, 42, 0.9); color: #fff; font-size: 0.95rem; outline: none; }
        .search-bar button { padding: 0 18px; border-radius: 14px; border: none; background: var(--accent); color: #052e16; font-weight: 700; cursor: pointer; }

        .vibe-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 12px; scrollbar-width: none; }
        .vibe-chips::-webkit-scrollbar { display: none; }
        .chip { white-space: nowrap; padding: 8px 14px; border-radius: 20px; background: var(--card); border: 1px solid rgba(255,255,255,0.08); font-size: 0.82rem; cursor: pointer; }
        .chip.active { background: var(--accent); color: #052e16; font-weight: 700; }

        .section-title { font-size: 1.05rem; font-weight: 700; margin: 10px 0 14px; display: flex; justify-content: space-between; align-items: center; }

        .song-list { display: flex; flex-direction: column; gap: 10px; }
        .song-card { display: flex; align-items: center; gap: 12px; background: var(--card); padding: 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .song-card.playing { border-color: var(--accent); background: rgba(16, 185, 129, 0.14); }
        .song-card img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: #1e293b; }
        .song-info { flex: 1; overflow: hidden; }
        .song-title { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist { font-size: 0.78rem; color: var(--subtext); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .icon-btn { background: rgba(255,255,255,0.08); border: none; color: #fff; width: 36px; height: 36px; border-radius: 10px; cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; }
        .icon-btn.saved { background: rgba(16,185,129,0.2); color: #10b981; }

        .load-more-btn { width: 100%; padding: 14px; margin-top: 15px; border-radius: 14px; border: 1px dashed var(--accent); background: rgba(16, 185, 129, 0.08); color: var(--accent); font-weight: 700; cursor: pointer; text-align: center; }

        /* Full Screen Player Modal */
        .player-modal { position: fixed; inset: 0; background: linear-gradient(180deg, #111827 0%, #090d16 100%); z-index: 100; display: none; flex-direction: column; justify-content: space-between; padding: 18px 20px 24px; overflow-y: auto; }
        .player-modal.open { display: flex; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; }
        .mode-toggle { background: rgba(255,255,255,0.1); border-radius: 20px; padding: 3px; display: flex; gap: 4px; }
        .mode-btn { padding: 5px 12px; border-radius: 16px; border: none; background: transparent; color: #fff; font-size: 0.76rem; cursor: pointer; }
        .mode-btn.active { background: var(--accent); color: #052e16; font-weight: 700; }

        .media-stage { position: relative; width: 100%; max-width: 300px; aspect-ratio: 1/1; margin: 10px auto; border-radius: 22px; overflow: hidden; box-shadow: 0 20px 45px rgba(0,0,0,0.6); background: #000; display: flex; align-items: center; justify-content: center; }
        .media-stage img { width: 100%; height: 100%; object-fit: cover; }
        .media-stage video { width: 100%; height: 100%; object-fit: contain; display: none; background: #000; }
        .tap-zone { position: absolute; top: 0; bottom: 0; width: 45%; z-index: 10; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.2rem; color: #fff; opacity: 0; transition: opacity 0.2s; }
        .tap-left { left: 0; background: radial-gradient(circle at left, rgba(255,255,255,0.3), transparent 70%); }
        .tap-right { right: 0; background: radial-gradient(circle at right, rgba(255,255,255,0.3), transparent 70%); }
        .tap-zone.show { opacity: 1; }

        .player-meta { text-align: center; margin: 4px 0; }
        .player-meta h2 { font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-meta p { color: var(--subtext); font-size: 0.82rem; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .seek-area { width: 100%; margin: 6px 0; }
        .seek-bar { width: 100%; accent-color: var(--accent); height: 5px; cursor: pointer; }
        .time-row { display: flex; justify-content: space-between; font-size: 0.74rem; color: var(--subtext); margin-top: 4px; }

        .controls-row { display: flex; justify-content: center; align-items: center; gap: 16px; margin: 6px 0; }
        .ctrl-btn { background: rgba(255,255,255,0.08); border: none; color: #fff; width: 42px; height: 42px; border-radius: 50%; font-size: 0.95rem; cursor: pointer; }
        .play-main { width: 58px; height: 58px; background: var(--accent); color: #052e16; font-size: 1.3rem; font-weight: bold; box-shadow: 0 8px 25px var(--accent-glow); }

        .dl-bar { display: flex; gap: 8px; margin-top: 8px; }
        .dl-chip { flex: 1; padding: 9px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.06); color: #fff; font-weight: 600; font-size: 0.76rem; text-align: center; cursor: pointer; }
        .dl-chip:active { background: var(--accent); color: #052e16; }

        .mini-player { position: fixed; bottom: 64px; left: 10px; right: 10px; background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 8px 12px; display: none; align-items: center; gap: 10px; z-index: 50; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
        .mini-player img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; }
        .mini-info { flex: 1; overflow: hidden; cursor: pointer; }
        .mini-title { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-sub { font-size: 0.74rem; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 58px; background: rgba(9, 13, 22, 0.96); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.06); z-index: 60; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.74rem; color: var(--subtext); cursor: pointer; gap: 2px; }
        .nav-item.active { color: var(--accent); font-weight: 700; }

        .toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 9px 16px; border-radius: 20px; font-size: 0.82rem; z-index: 200; display: none; border: 1px solid var(--accent); box-shadow: 0 6px 20px rgba(0,0,0,0.5); white-space: nowrap; }
    </style>
</head>
<body>

<div class="ambient-bg"></div>
<div class="toast" id="toastMsg"></div>

<header>
    <div class="logo">⚡ VibeStream Pro</div>
    <div class="badge" onclick="switchTab('vault')">🔒 Vault</div>
</header>

<div class="container">
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search song, artist, movie..." onkeypress="if(event.key==='Enter') searchMusic()">
        <button onclick="searchMusic()">Search</button>
    </div>

    <div class="vibe-chips" id="vibeChipsBar">
        <div class="chip active" onclick="loadVibe('Trending India', this)">🔥 Top 100 Trending</div>
        <div class="chip" onclick="loadVibe('Arijit Singh Hits', this)">❤️ Arijit Unlimited</div>
        <div class="chip" onclick="loadVibe('Bollywood Lofi Chill', this)">🌙 Late Night Lofi</div>
        <div class="chip" onclick="loadVibe('Punjabi Party Hits', this)">🕺 Punjabi Non-Stop</div>
        <div class="chip" onclick="loadVibe('90s Evergreen Hindi', this)">📻 90s Gold</div>
    </div>

    <div class="section-title">
        <span id="listHeading">🔥 Top 100 Trending</span>
        <span style="font-size:0.75rem; color:var(--accent);" id="songCount"></span>
    </div>

    <div class="song-list" id="songList"></div>
    <button class="load-more-btn" id="loadMoreBtn" onclick="fetchMoreSongs()">➕ Load 50+ More Vibe Songs</button>
</div>

<!-- Mini Player -->
<div class="mini-player" id="miniPlayer">
    <img id="miniThumb" src="" alt="">
    <div class="mini-info" onclick="toggleModal(true)">
        <div class="mini-title" id="miniTitle">Not Playing</div>
        <div class="mini-sub" id="miniArtist">Tap to expand</div>
    </div>
    <button class="icon-btn" onclick="playPrev()">⏮</button>
    <button class="icon-btn" id="miniPlayBtn" onclick="togglePlay()">▶</button>
    <button class="icon-btn" onclick="playNext()">⏭</button>
</div>

<!-- Full Screen Player Modal -->
<div class="player-modal" id="playerModal">
    <div class="modal-header">
        <button class="icon-btn" onclick="toggleModal(false)">⬇</button>
        <div class="mode-toggle">
            <button class="mode-btn active" id="audioModeBtn" onclick="switchMode('audio')">🎵 Audio</button>
            <button class="mode-btn" id="videoModeBtn" onclick="switchMode('video')">🎬 Video</button>
        </div>
        <button class="icon-btn" onclick="saveCurrentToVault()" title="Lock in Offline Vault">🔒</button>
    </div>

    <div class="media-stage" id="mediaStage">
        <div class="tap-zone tap-left" id="tapLeft">⏪ -10s</div>
        <div class="tap-zone tap-right" id="tapRight">⏩ +10s</div>
        <img id="fullThumb" src="" alt="Poster">
        <video id="mediaElement" playsinline crossorigin="anonymous"></video>
    </div>

    <div class="player-meta">
        <h2 id="fullTitle">Select a Song</h2>
        <p id="fullArtist">Zero-Delay Vibe</p>
    </div>

    <div class="seek-area">
        <input type="range" class="seek-bar" id="seekBar" value="0" min="0" max="100" step="0.1">
        <div class="time-row">
            <span id="currTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>
    </div>

    <div class="controls-row">
        <button class="ctrl-btn" onclick="seekRelative(-10)">-10s</button>
        <button class="ctrl-btn" onclick="playPrev()">⏮</button>
        <button class="ctrl-btn play-main" id="fullPlayBtn" onclick="togglePlay()">▶</button>
        <button class="ctrl-btn" onclick="playNext()">⏭</button>
        <button class="ctrl-btn" onclick="seekRelative(10)">+10s</button>
    </div>

    <div>
        <p style="font-size:0.72rem; color:var(--subtext); text-align:center; margin-bottom:4px;">1-Click Instant Download:</p>
        <div class="dl-bar">
            <div class="dl-chip" onclick="downloadCurrentSong('mp3')">⬇ Download MP3</div>
            <div class="dl-chip" onclick="downloadCurrentSong('mp4')">⬇ Download Video</div>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item active" id="navHome" onclick="switchTab('home')">
        <span>🏠</span><span>Explore</span>
    </div>
    <div class="nav-item" id="navVault" onclick="switchTab('vault')">
        <span>🔒</span><span>Offline Vault</span>
    </div>
</div>

<script>
    const media = document.getElementById('mediaElement');
    let currentQueue = [];
    let vaultSongsCache = [];
    let currentIndex = -1;
    let currentMode = 'audio';
    let isVaultView = false;
    let db = null;

    const req = indexedDB.open("VibeStream_Ultimate_Vault", 1);
    req.onupgradeneeded = (e) => {
        db = e.target.result;
        if (!db.objectStoreNames.contains("vault")) db.createObjectStore("vault", { keyPath: "query" });
    };
    req.onsuccess = (e) => {
        db = e.target.result;
        refreshVaultCache();
    };

    function showToast(msg) {
        const t = document.getElementById('toastMsg');
        t.innerText = msg;
        t.style.display = 'block';
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => t.style.display = 'none', 2600);
    }

    function refreshVaultCache() {
        return new Promise((resolve) => {
            if (!db) return resolve([]);
            const tx = db.transaction("vault", "readonly");
            const store = tx.objectStore("vault").getAll();
            store.onsuccess = () => {
                vaultSongsCache = store.result || [];
                resolve(vaultSongsCache);
            };
            store.onerror = () => resolve([]);
        });
    }

    // MULTI-FALLBACK AUDIO EXTRACTOR (Never fails to find a working stream)
    async function fetchWorkingAudio(query) {
        const clean = query.replace('official audio', '').replace('audio', '').trim();
        
        // Node 1: JioSaavn APIS
        const saavnApis = [
            `https://saavn.dev/api/search/songs?query=${encodeURIComponent(clean)}&limit=1`,
            `https://jiosaavn-api-privatecvc2.vercel.app/search/songs?query=${encodeURIComponent(clean)}&limit=1`
        ];
        for (const u of saavnApis) {
            try {
                const r = await fetch(u);
                const d = await r.json();
                const results = d.data?.results || d.data || [];
                if (results.length > 0) {
                    const dl = results[0].downloadUrl;
                    if (dl && dl.length > 0) return dl[dl.length - 1].url || dl[dl.length - 1].link;
                }
            } catch (e) {}
        }

        // Node 2: Piped / Invidious Audio Nodes
        const pipedNodes = [
            "https://pipedapi.kavin.rocks",
            "https://pipedapi.tokhmi.xyz",
            "https://pipedapi.moomoo.me"
        ];
        for (const node of pipedNodes) {
            try {
                const s = await fetch(`${node}/search?q=${encodeURIComponent(clean + ' audio')}&filter=videos`).then(r => r.json());
                if (s.items && s.items.length > 0) {
                    const id = s.items[0].url.split('v=')[1];
                    const st = await fetch(`${node}/streams/${id}`).then(r => r.json());
                    const audioStream = (st.audioStreams || []).sort((a,b) => b.bitrate - a.bitrate)[0];
                    if (audioStream && audioStream.url) return audioStream.url;
                }
            } catch (e) {}
        }
        return null;
    }

    async function fetchWorkingVideo(query) {
        const clean = query.replace('official video', '').replace('video', '').trim();
        const nodes = [
            "https://pipedapi.kavin.rocks",
            "https://pipedapi.tokhmi.xyz",
            "https://pipedapi.moomoo.me"
        ];
        for (const node of nodes) {
            try {
                const s = await fetch(`${node}/search?q=${encodeURIComponent(clean + ' official video')}&filter=videos`).then(r => r.json());
                if (s.items && s.items.length > 0) {
                    const id = s.items[0].url.split('v=')[1];
                    const st = await fetch(`${node}/streams/${id}`).then(r => r.json());
                    const v = (st.videoStreams || []).find(x => !x.videoOnly && x.url);
                    if (v) return v.url;
                }
            } catch (e) {}
        }
        return null;
    }

    async function loadTrending() {
        isVaultView = false;
        document.getElementById('vibeChipsBar').style.display = 'flex';
        document.getElementById('loadMoreBtn').style.display = 'block';
        document.getElementById('listHeading').innerText = "🔥 Top 100 Trending";
        await refreshVaultCache();
        try {
            const res = await fetch("https://itunes.apple.com/in/rss/topsongs/limit=100/json");
            const data = await res.json();
            const entries = data.feed?.entry || [];
            currentQueue = entries.map(item => ({
                title: item['im:name'].label,
                artist: item['im:artist'].label,
                thumbnail: item['im:image'][item['im:image'].length - 1].label.replace('170x170bb', '600x600bb'),
                query: `${item['im:name'].label} ${item['im:artist'].label}`
            }));
            renderSongList(currentQueue, false);
        } catch (e) {
            switchTab('vault');
        }
    }

    async function loadVibe(vibeQuery, chipEl) {
        isVaultView = false;
        document.getElementById('loadMoreBtn').style.display = 'block';
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        if (chipEl) chipEl.classList.add('active');
        if (vibeQuery === 'Trending India') return loadTrending();
        document.getElementById('listHeading').innerText = `✨ ${vibeQuery}`;
        try {
            const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(vibeQuery)}&country=IN&media=music&limit=80`);
            const data = await res.json();
            currentQueue = (data.results || []).map(item => ({
                title: item.trackName || 'Unknown',
                artist: item.artistName || 'Unknown',
                thumbnail: (item.artworkUrl100 || '').replace('100x100bb', '600x600bb'),
                query: `${item.trackName} ${item.artistName}`
            }));
            renderSongList(currentQueue, false);
        } catch (e) {
            switchTab('vault');
        }
    }

    async function searchMusic() {
        const q = document.getElementById('searchInput').value.trim();
        if (!q) return;
        if (isVaultView) {
            currentQueue = vaultSongsCache.filter(s => s.title.toLowerCase().includes(q.toLowerCase()) || s.artist.toLowerCase().includes(q.toLowerCase()));
            renderSongList(currentQueue, true);
            return;
        }
        try {
            const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&country=IN&media=music&limit=80`);
            const data = await res.json();
            currentQueue = (data.results || []).map(item => ({
                title: item.trackName || 'Unknown',
                artist: item.artistName || 'Unknown',
                thumbnail: (item.artworkUrl100 || '').replace('100x100bb', '600x600bb'),
                query: `${item.trackName} ${item.artistName}`
            }));
            renderSongList(currentQueue, false);
        } catch (e) {
            switchTab('vault');
        }
    }

    function renderSongList(songs, isVault = false) {
        const list = document.getElementById('songList');
        document.getElementById('songCount').innerText = `${songs.length} tracks`;
        list.innerHTML = '';
        if (songs.length === 0) {
            list.innerHTML = `<p style="text-align:center; color:var(--subtext); padding:30px;">${isVault ? 'Vault is empty. Tap ➕ to save offline!' : 'No tracks found.'}</p>`;
            return;
        }
        const savedMap = new Set(vaultSongsCache.map(v => v.query));
        songs.forEach((s, idx) => {
            const isSaved = savedMap.has(s.query);
            const card = document.createElement('div');
            card.className = `song-card ${idx === currentIndex ? 'playing' : ''}`;
            card.id = `song-card-${idx}`;
            card.innerHTML = `
                <img src="${s.thumbnail}" loading="lazy" alt="art" onclick="playTrack(${idx})">
                <div class="song-info" onclick="playTrack(${idx})">
                    <div class="song-title">${s.title}</div>
                    <div class="song-artist">${s.artist} ${isSaved && !isVault ? ' • 🔒 In Vault' : ''}</div>
                </div>
                <div>
                    ${isVault 
                        ? `<button class="icon-btn saved" onclick="deleteFromVault('${s.query.replace(/'/g, "\\'")}')">🗑️</button>`
                        : `<button class="icon-btn ${isSaved ? 'saved' : ''}" id="vault-btn-${idx}" onclick="quickSaveToVault(${idx})">${isSaved ? '✅' : '➕'}</button>`
                    }
                </div>
            `;
            list.appendChild(card);
        });
    }

    async function fetchMoreSongs() {
        if (isVaultView) return;
        const artist = currentIndex >= 0 && currentQueue[currentIndex] ? currentQueue[currentIndex].artist.split(',')[0] : 'Bollywood';
        try {
            const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(artist + ' hits')}&country=IN&media=music&limit=50`);
            const data = await res.json();
            const more = (data.results || []).map(item => ({
                title: item.trackName || 'Unknown',
                artist: item.artistName || 'Unknown',
                thumbnail: (item.artworkUrl100 || '').replace('100x100bb', '600x600bb'),
                query: `${item.trackName} ${item.artistName}`
            }));
            const existing = new Set(currentQueue.map(x => x.query));
            const unique = more.filter(s => !existing.has(s.query));
            currentQueue.push(...unique);
            renderSongList(currentQueue, false);
        } catch (e) {}
    }

    async function playTrack(index) {
        currentIndex = index;
        const song = currentQueue[index];
        if (!song) return;

        document.querySelectorAll('.song-card').forEach(c => c.classList.remove('playing'));
        const active = document.getElementById(`song-card-${index}`);
        if (active) active.classList.add('playing');

        document.getElementById('miniPlayer').style.display = 'flex';
        document.getElementById('miniTitle').innerText = song.title;
        document.getElementById('miniArtist').innerText = song.artist;
        document.getElementById('miniThumb').src = song.thumbnail;
        document.getElementById('fullTitle').innerText = song.title;
        document.getElementById('fullArtist').innerText = song.artist;
        document.getElementById('fullThumb').src = song.thumbnail;

        await refreshVaultCache();
        const vaultMatch = vaultSongsCache.find(v => v.query === song.query);
        if (vaultMatch && vaultMatch.blob && currentMode === 'audio') {
            media.src = URL.createObjectURL(vaultMatch.blob);
            media.play();
            showToast("⚡ Playing from Offline Vault");
            return;
        }

        showToast(currentMode === 'video' ? "🎬 Loading Video..." : "⏳ Loading Audio Stream...");
        let url = null;
        if (currentMode === 'video') {
            url = await fetchWorkingVideo(song.query);
        }
        if (!url) {
            url = await fetchWorkingAudio(song.query);
        }

        if (url) {
            media.src = url;
            media.play();
        } else {
            showToast("❌ Stream unavailable");
        }
    }

    async function quickSaveToVault(idx) {
        const song = currentQueue[idx];
        showToast(`🔒 Locking in Vault...`);
        try {
            const audioUrl = await fetchWorkingAudio(song.query);
            if (!audioUrl) throw new Error();
            const r = await fetch(audioUrl);
            const blob = await r.blob();

            const tx = db.transaction("vault", "readwrite");
            tx.objectStore("vault").put({
                query: song.query,
                title: song.title,
                artist: song.artist,
                thumbnail: song.thumbnail,
                blob: blob
            });
            tx.oncomplete = async () => {
                await refreshVaultCache();
                document.getElementById(`vault-btn-${idx}`).innerText = '✅';
                showToast("✅ Locked in Offline Vault!");
            };
        } catch (e) {
            showToast("❌ Failed to save");
        }
    }

    async function downloadCurrentSong(fmt) {
        if (currentIndex < 0) return;
        const song = currentQueue[currentIndex];
        showToast(`⏳ Preparing ${fmt.toUpperCase()} Download...`);
        try {
            let dlUrl = fmt === 'mp4' ? await fetchWorkingVideo(song.query) : await fetchWorkingAudio(song.query);
            if (!dlUrl) throw new Error();
            const r = await fetch(dlUrl);
            const blob = await r.blob();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${song.title.replace(/[^a-zA-Z0-9]/g, '_')}.${fmt === 'mp4' ? 'mp4' : 'm4a'}`;
            a.click();
            showToast(`🎉 Download Complete!`);
        } catch (e) {
            showToast("❌ Download failed");
        }
    }

    async function loadVaultSongs() {
        isVaultView = true;
        document.getElementById('vibeChipsBar').style.display = 'none';
        document.getElementById('loadMoreBtn').style.display = 'none';
        document.getElementById('listHeading').innerText = "🔒 Offline Vault (Works Without Internet)";
        await refreshVaultCache();
        currentQueue = [...vaultSongsCache];
        renderSongList(currentQueue, true);
    }

    function deleteFromVault(query) {
        const tx = db.transaction("vault", "readwrite");
        tx.objectStore("vault").delete(query);
        tx.oncomplete = () => {
            showToast("🗑️ Removed from Vault");
            loadVaultSongs();
        };
    }

    function switchMode(mode) {
        if (currentMode === mode) return;
        currentMode = mode;
        document.getElementById('audioModeBtn').classList.toggle('active', mode === 'audio');
        document.getElementById('videoModeBtn').classList.toggle('active', mode === 'video');
        document.getElementById('fullThumb').style.display = mode === 'audio' ? 'block' : 'none';
        media.style.display = mode === 'video' ? 'block' : 'none';
        if (currentIndex >= 0) playTrack(currentIndex);
    }

    media.addEventListener('timeupdate', () => {
        if (!media.duration) return;
        document.getElementById('seekBar').value = (media.currentTime / media.duration) * 100;
        document.getElementById('currTime').innerText = formatTime(media.currentTime);
        document.getElementById('totalTime').innerText = formatTime(media.duration);
    });

    media.addEventListener('ended', () => playNext());
    media.addEventListener('play', () => {
        document.getElementById('miniPlayBtn').innerText = '⏸';
        document.getElementById('fullPlayBtn').innerText = '⏸';
    });
    media.addEventListener('pause', () => {
        document.getElementById('miniPlayBtn').innerText = '▶';
        document.getElementById('fullPlayBtn').innerText = '▶';
    });

    function togglePlay() { media.paused ? media.play() : media.pause(); }
    function playNext() { if (currentIndex + 1 < currentQueue.length) playTrack(currentIndex + 1); }
    function playPrev() { if (currentIndex - 1 >= 0) playTrack(currentIndex - 1); }
    document.getElementById('seekBar').addEventListener('input', (e) => {
        if (media.duration) media.currentTime = (e.target.value / 100) * media.duration;
    });

    let lastLeft = 0, lastRight = 0;
    document.getElementById('tapLeft').addEventListener('touchend', () => {
        const now = Date.now();
        if (now - lastLeft < 300) { seekRelative(-10); flashZone('tapLeft'); }
        lastLeft = now;
    });
    document.getElementById('tapRight').addEventListener('touchend', () => {
        const now = Date.now();
        if (now - lastRight < 300) { seekRelative(10); flashZone('tapRight'); }
        lastRight = now;
    });
    function seekRelative(sec) { if (media.duration) media.currentTime = Math.min(Math.max(0, media.currentTime + sec), media.duration); }
    function flashZone(id) { const el = document.getElementById(id); el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 400); }

    function toggleModal(open) { document.getElementById('playerModal').classList.toggle('open', open); }
    function switchTab(tab) {
        document.getElementById('navHome').classList.toggle('active', tab === 'home');
        document.getElementById('navVault').classList.toggle('active', tab === 'vault');
        tab === 'home' ? loadTrending() : loadVaultSongs();
    }
    function formatTime(sec) {
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
    }
    window.onload = loadTrending;
</script>
</body>
</html>
